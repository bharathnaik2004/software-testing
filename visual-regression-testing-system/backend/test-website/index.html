<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Regression Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #1f2937;
      }
      .container {
        max-width: 900px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      }
      h1 {
        color: #111827;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }
      .card {
        background: #eef2ff;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Visual Regression Demo</h1>
      <p>Welcome to the test website. This page is used for visual regression testing.</p>
      <button id="demoButton">Click Me</button>

      <div class="card-grid">
        <div class="card">
          <h3>Section 1</h3>
          <p>Product card example.</p>
        </div>
        <div class="card">
          <h3>Section 2</h3>
          <p>Analytics card example.</p>
        </div>
        <div class="card">
          <h3>Section 3</h3>
          <p>Summary card example.</p>
        </div>
      </div>
    </div>

    <script>
      const button = document.getElementById('demoButton');
      button.addEventListener('click', () => {
        alert('Button clicked successfully');
      });
    </script>
  </body>
</html>
